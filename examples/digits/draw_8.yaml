    description: Marker draws digit 8
    tool:
      name: tool1
    target:
      xyz: [0.00, 0.00, 0.05]
      rpy: [180.0, 0.0, 0.0]
    approach:
      elevation: -90.0
      distance: 0.12
    retract:
      axis: [0.0, 0.0, -1.0]
      distance: 0.12
    points:
      - [ 0.0000,  0.0000, 0.0000]
      - [ 0.0160,  0.0120, 0.0000]
      - [ 0.0220,  0.0280, 0.0000]
      - [ 0.0160,  0.0440, 0.0000]
      - [ 0.0000,  0.0520, 0.0000]
      - [-0.0160,  0.0440, 0.0000]
      - [-0.0220,  0.0280, 0.0000]
      - [-0.0160,  0.0120, 0.0000]
      - [ 0.0000,  0.0000, 0.0000]
      - [ 0.0160, -0.0120, 0.0000]
      - [ 0.0220, -0.0280, 0.0000]
      - [ 0.0160, -0.0440, 0.0000]
      - [ 0.0000, -0.0520, 0.0000]
      - [-0.0160, -0.0440, 0.0000]
      - [-0.0220, -0.0280, 0.0000]
      - [-0.0160, -0.0120, 0.0000]
      - [ 0.0000,  0.0000, 0.0000]

sequence:
  - rest
  - draw
  - rest
