# Digit 8 draw stroke (local board frame at origin).
# Included by examples/whiteboard_count.yaml

version: 1
name: draw_8

units:
  length: m
  angle: deg

robot:
  rest:
    joints: [0.0, -70.0, 110.0, 0.0, 50.0, 0.0]
    tool:
      xyz: [0.00, 0.00, 0.35]
      rpy: [180.0, 0.0, 0.0]

limits:
  linear: 0.25
  angular: 90.0
  approach_linear: 0.06

grind_paths:
