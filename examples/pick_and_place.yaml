# Task Definition Language — pick and place sketch
# Frames are tool poses in the world. Lengths in meters, angles in degrees.
#
# Stations on a circle (radius 0.35 m) around the origin, like a clock face:
#   12  pickup    3  process    ~4:30 grind    6  punch    9  dropoff
# Rest pose is at the center.

version: 1
name: table_pick_to_bin

units:
  length: m
  angle: deg

robot:
  rest:
    joints: [0.0, -70.0, 110.0, 0.0, 50.0, 0.0]
    tool:
      xyz: [0.00, 0.00, 0.42]
      rpy: [180.0, 0.0, 0.0]

limits:
  linear: 0.30          # m/s for free-space and rest moves
  angular: 90.0         # deg/s
  approach_linear: 0.08 # m/s along approach / retract / target

io:
  machine_cycle:
    description: Tending machine cycle start
    initial: false
  punch_press:
    description: Punch press motor enable
    initial: false

grippers:
  gripper:
    description: Carried part gripper
    initial: open

tower_lights:
  cell:
    description: Cell status stack light
    states:
      - { name: pick, color: "#29B6F6" }
      - { name: tend, color: "#FFA726" }
      - { name: grind, color: "#BA68C8" }
      - { name: punch, color: "#EF5350" }
      - { name: place, color: "#66BB6A" }
    tasks:
      pickup: 0
      process: 1
      grind: 2
      punch: 3
      dropoff: 4

locations:
  pickup:
    description: Pick tray at 12 o'clock (top of the work circle)
    tool:
      name: tool1
    target:
      xyz: [0.00, 0.35, 0.04]
      rpy: [180.0, 0.0, 0.0]
    search:
      shape: box
      extents: [0.10, 0.08, 0.03]
      # Offset of the "found" pick inside the search region (target frame)
      found_offset: [0.02, -0.01, 0.0]
    approach:
      azimuth: 0.0      # in the target frame: 0 deg = +X, 90 = +Y
      elevation: -90.0  # -90 deg = along -Z (back off along tool Z)
      distance: 0.12
    retract:
      azimuth: 20.0
      elevation: -70.0
      distance: 0.14
    pattern:
      grid:
        counts: [3, 2]          # 3 along target X, 2 along target Y; X varies fastest
        step: [0.06, 0.05, 0.0]
    dwell: 0.35
    sequence:
      - approach
      - target
      - gripper: close
      - retract

  dropoff:
    description: Place into a bin at 9 o'clock (vertical down)
    tool:
      name: tool1
    target:
      xyz: [-0.35, 0.00, 0.04]
      rpy: [180.0, 0.0, 0.0]
    search:
      shape: cylinder
      radius: 0.06
      height: 0.05
    approach:
      azimuth: 0.0
      elevation: -90.0        # straight down along tool -Z
      distance: 0.16
    retract:
      axis: [0.0, 0.0, -1.0] # straight up along world +Z
      distance: 0.12
    dwell: 0.25
    sequence:
      - approach
      - target
      - gripper: open
      - retract

  process:
    description: Machine tending at 3 o'clock (insert away from center)
    tool:
      name: tool1
    target:
      xyz: [0.35, 0.00, 0.13]
      rpy: [90.0, 0.0, 90.0]   # tool Z toward +X (away from origin)
    search:
      shape: box
      extents: [0.04, 0.03, 0.04]
    approach:
      azimuth: 0.0
      elevation: -90.0        # back along tool -Z = world -X (from center side)
      distance: 0.16
    post:
      - axis: [0.0, 1.0, 0.0] # tool Y = world +Z; small lift after the stamp
        distance: 0.03
      - axis: [0.0, 0.0, -1.0]# then retract along world -X (back toward center)
        distance: 0.14
    dwell: 0.40
    sequence:
      - approach
      - target
      - io:
          signal: machine_cycle
          pulse: 0.5
      - pause: 1.0
      - post: 0
      - post: 1

grind_paths:
  grind:
    description: Sanding figure-8 between process (3) and punch (6)
    tool:
      name: tool1
    target:
      xyz: [0.25, -0.25, 0.05]
      rpy: [180.0, 0.0, 0.0]
    approach:
      elevation: -90.0
      distance: 0.10
    retract:
      axis: [0.0, 0.0, -1.0]
      distance: 0.10
    # 20 points of a figure-8 in the target XY plane (x = a sin t, y = a/2 sin 2t)
    points:
      - [ 0.0000,  0.0000, 0.0000]
      - [ 0.0155,  0.0147, 0.0000]
      - [ 0.0294,  0.0238, 0.0000]
      - [ 0.0405,  0.0238, 0.0000]
      - [ 0.0476,  0.0147, 0.0000]
      - [ 0.0500,  0.0000, 0.0000]
      - [ 0.0476, -0.0147, 0.0000]
      - [ 0.0405, -0.0238, 0.0000]
      - [ 0.0294, -0.0238, 0.0000]
      - [ 0.0155, -0.0147, 0.0000]
      - [ 0.0000,  0.0000, 0.0000]
      - [-0.0155,  0.0147, 0.0000]
      - [-0.0294,  0.0238, 0.0000]
      - [-0.0405,  0.0238, 0.0000]
      - [-0.0476,  0.0147, 0.0000]
      - [-0.0500,  0.0000, 0.0000]
      - [-0.0476, -0.0147, 0.0000]
      - [-0.0405, -0.0238, 0.0000]
      - [-0.0294, -0.0238, 0.0000]
      - [-0.0155, -0.0147, 0.0000]

force_pushes:
  punch:
    description: Force punch at 6 o'clock (bottom of the work circle)
    tool:
      name: tool1
    target:
      xyz: [0.00, -0.35, 0.13]
      rpy: [180.0, 0.0, 0.0]
    approach:
      azimuth: 0.0
      elevation: -55.0
      distance: 0.12
    push:
      axis: [0.0, 0.0, 1.0]   # along tool +Z into the pocket
      max_travel: 0.05
      force_limit: 30.0
    retract:
      axis: [0.0, 0.0, -1.0]
      distance: 0.12
    sequence:
      - approach
      - io:
          signal: punch_press
          set: "on"
      - start
      - push
      - retract
      - io:
          signal: punch_press
          set: "off"

# Named via poses. Listed between two locations, free-space goto passes through them.
keyholes:
  over_fixture:
    description: Arc between pickup (12) and process (3)
    tool:
      name: tool1
    xyz: [0.22, 0.22, 0.36]
    rpy: [180.0, 0.0, 45.0]
    radius: 0.055

sequence:
  - rest
  - repeat:
      times: 7
      steps:
        - pickup
        - keyhole: over_fixture
        - process
        - grind
        - punch
        - dropoff
        - rest
