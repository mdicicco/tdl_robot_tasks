# Whiteboard demo: marker (tool1) draws a "3", then eraser (tool2) zig-zags over it.
# Board is horizontal in XY; rest starts above the writing surface.
# Both grind paths share the same target so they work the same spot.

version: 1
name: whiteboard_draw_erase

units:
  length: m
  angle: deg

robot:
  rest:
    joints: [0.0, -70.0, 110.0, 0.0, 50.0, 0.0]
    tool:
      xyz: [0.00, 0.00, 0.35]
      rpy: [180.0, 0.0, 0.0]

limits:
  linear: 0.25
  angular: 90.0
  approach_linear: 0.06

tower_lights:
  cell:
    description: Marker vs eraser
    states:
      - { name: draw, color: "#29B6F6" }
      - { name: erase, color: "#FFCC80" }
    tasks:
      draw_3: 0
      erase: 1

grind_paths:
  draw_3:
    description: Marker draws a number 3 on the whiteboard
    tool:
      name: tool1
    target:
      xyz: [0.00, 0.00, 0.05]
      rpy: [180.0, 0.0, 0.0]
    approach:
      elevation: -90.0
      distance: 0.12
    retract:
      axis: [0.0, 0.0, -1.0]
      distance: 0.12
    # Single-stroke "3" in the board XY plane (~10 cm tall)
    points:
      - [-0.0280,  0.0520, 0.0000]
      - [-0.0140,  0.0520, 0.0000]
      - [ 0.0000,  0.0520, 0.0000]
      - [ 0.0140,  0.0520, 0.0000]
      - [ 0.0280,  0.0520, 0.0000]
      - [ 0.0280,  0.0400, 0.0000]
      - [ 0.0260,  0.0280, 0.0000]
      - [ 0.0200,  0.0160, 0.0000]
      - [ 0.0100,  0.0080, 0.0000]
      - [ 0.0000,  0.0000, 0.0000]
      - [-0.0120,  0.0000, 0.0000]
      - [ 0.0000,  0.0000, 0.0000]
      - [ 0.0100, -0.0080, 0.0000]
      - [ 0.0200, -0.0160, 0.0000]
      - [ 0.0260, -0.0280, 0.0000]
      - [ 0.0280, -0.0400, 0.0000]
      - [ 0.0280, -0.0520, 0.0000]
      - [ 0.0140, -0.0520, 0.0000]
      - [ 0.0000, -0.0520, 0.0000]
      - [-0.0140, -0.0520, 0.0000]
      - [-0.0280, -0.0520, 0.0000]

  erase:
    description: Eraser (tool2) zig-zags over the same glyph
    tool:
      name: tool2
    target:
      xyz: [0.00, 0.00, 0.05]
      rpy: [180.0, 0.0, 0.0]
    approach:
      elevation: -90.0
      distance: 0.12
    retract:
      axis: [0.0, 0.0, -1.0]
      distance: 0.12
    # Back-and-forth strokes covering the "3" bounding box
    points:
      - [-0.0350,  0.0550, 0.0000]
      - [ 0.0350,  0.0550, 0.0000]
      - [ 0.0350,  0.0350, 0.0000]
      - [-0.0350,  0.0350, 0.0000]
      - [-0.0350,  0.0150, 0.0000]
      - [ 0.0350,  0.0150, 0.0000]
      - [ 0.0350, -0.0050, 0.0000]
      - [-0.0350, -0.0050, 0.0000]
      - [-0.0350, -0.0250, 0.0000]
      - [ 0.0350, -0.0250, 0.0000]
      - [ 0.0350, -0.0450, 0.0000]
      - [-0.0350, -0.0450, 0.0000]
      - [-0.0350, -0.0550, 0.0000]
      - [ 0.0350, -0.0550, 0.0000]

sequence:
  - rest
  - draw_3
  - erase
  - rest
