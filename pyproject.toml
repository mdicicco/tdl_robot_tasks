[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-definition-language"
version = "0.1.0"
description = "A YAML/JSON language and 3D viewer for pick-and-place motion sketches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "pyside6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tdl-viewer = "tdl.app:main"

[tool.setuptools.packages.find]
include = ["tdl*"]

[tool.setuptools.package-data]
tdl = ["py.typed"]
